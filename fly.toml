# fly.toml — FocusArena Backend
# Oluşturmak için: fly apps create focusarena-backend

app = "focusarena"
primary_region = "ams"  # Amsterdam — Türkiye'ye en yakın ücretsiz bölge

[build]
  dockerfile = "Dockerfile"

# Ortam değişkenleri (gizli olmayanlar buraya, gizliler fly secrets set ile)
[env]
  NODE_ENV = "production"
  PORT     = "8080"

# HTTP servisi tanımı
[http_service]
  internal_port       = 8080
  force_https         = true
  # App Review boyunca makine UYANIK kalmalı. Uykudaki makinede ilk istek
  # ~11 sn sürüyordu ve açılıştaki istek dalgası düşüyordu — Guideline 2.1
  # reddinin arkasındaki "boş ekran" şüphesi buydu.
  auto_stop_machines  = false  # Trafik yoksa DURDURMA
  auto_start_machines = true   # İstek gelince otomatik başlat
  min_machines_running = 1     # En az bir makine hep ayakta

  [http_service.concurrency]
    type       = "requests"
    hard_limit = 250
    soft_limit = 200

# WebSocket için TCP servisi (Socket.io)
# Fly.io HTTP servisi WebSocket'i zaten destekler,
# sadece upgrade header'ları doğru iletilmesi yeterli.

# Makine özellikleri
[[vm]]
  memory   = "256mb"
  cpu_kind = "shared"
  cpus     = 1
